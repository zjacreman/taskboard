[package]
name = "taskboard"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
notify = "6"
rayon = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3"
